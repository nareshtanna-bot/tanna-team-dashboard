<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tanna Team" />
  <meta name="description" content="Naresh Tanna — top priorities & Tanna Team fleet status" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <title>Tanna Team</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand-row">
        <div class="brand">
          <div class="logo" aria-hidden="true">T</div>
          <div>
            <h1>Tanna Team</h1>
            <p class="subtitle">Naresh · priorities &amp; fleet</p>
          </div>
        </div>
        <div class="updated" id="updated" title="America/New_York">
          <span class="dot" aria-hidden="true"></span>
          <span id="updated-text">…</span>
        </div>
      </div>
    </header>

    <section aria-labelledby="priorities-heading">
      <div class="section-head">
        <h2 id="priorities-heading">Top Priorities</h2>
        <span class="count" id="priority-count"></span>
      </div>
      <div class="priority-list" id="priorities">
        <div class="loading">Loading status…</div>
      </div>
    </section>

    <section aria-labelledby="bots-heading">
      <div class="section-head">
        <h2 id="bots-heading">Fleet · Right Now</h2>
        <span class="count" id="bot-count"></span>
      </div>
      <div class="filters" id="filters" role="tablist" aria-label="Filter by status"></div>
      <div class="bot-grid" id="bots"></div>
    </section>

    <footer>
      Personal status · no login · America/New_York
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
